name: Build

on:
  push:
    branches: [ "main" ]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            rid: linux-x64
            use-nix: true
            shell: nix develop -c bash -eo pipefail {0}

          - runs-on: ubuntu-24.04-arm
            rid: linux-arm64
            use-nix: true
            shell: nix develop -c bash -eo pipefail {0}

          - runs-on: windows-2025
            rid: win-x64
            use-nix: false
            shell: pwsh

          - runs-on: windows-11-arm
            rid: win-arm64
            use-nix: false
            shell: pwsh

          - runs-on: macos-26-intel
            rid: osx-x64
            use-nix: false
            shell: bash -eo pipefail {0}

          - runs-on: macos-15 # Not macos-26 because of https://github.com/dotnet/runtime/issues/119380
            rid: osx-arm64
            use-nix: false
            shell: bash -eo pipefail {0}

    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        if: ${{ matrix.use-nix }}
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Setup dev environment
        if: ${{ matrix.use-nix }}
        run: 'true'

      - name: Setup .NET
        if: ${{ !matrix.use-nix }}
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test -c Release --no-build --no-restore --verbosity normal

      - name: Publish
        run: dotnet publish AgentMcp -c Release -r ${{ matrix.rid }} --no-build --no-restore -o AgentMcp/bin/Release/${{ matrix.rid }}/publish

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentMcp-${{ matrix.rid }}
          path: |
            AgentMcp/bin/Release/${{ matrix.rid }}/publish

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AgentMcp-*
          path: artifacts
          github-token: ${{ github.token }}
          skip-decompress: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          FILES=(artifacts/*/*.zip)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              --clobber \
              "${FILES[@]}"
          else
            gh release create "$TAG" \
              --generate-notes \
              --prerelease="$IS_PRERELEASE" \
              "${FILES[@]}"
          fi
